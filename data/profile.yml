tagline:
  en: I build statistical methods for high-dimensional, censored and functional data — and the open-source tools that make them usable.
  it: Sviluppo metodi statistici per dati ad alta dimensionalità, censurati e funzionali — e gli strumenti open source per usarli.
bio:
  en: I am an Associate Professor of Statistics at the Department of Economics, Business and Statistics, University of Palermo. My research lies in methodological and computational statistics, with a focus on penalized models, graphical inference, quantile regression, and functional and high-dimensional data analysis. These methodological interests are accompanied by interdisciplinary applications in environmental, biomedical, and genomic research. I earned my PhD in Statistics with the Doctor Europaeus distinction and have been involved in several national research projects, including PRIN initiatives on graphical models, air pollution, asthma, and earthquake forecasting. I am also co-inventor of an Italian patent in the field of genetic authentication of agri-food products. I regularly use R for research, teaching, and methodological development.
  it: Sono Professore Associato di Statistica presso il Dipartimento di Scienze Economiche, Aziendali e Statistiche dell'Università degli Studi di Palermo. La mia attività scientifica si colloca nell'ambito della statistica metodologica e computazionale, con particolare riferimento a modelli penalizzati, inferenza grafica, regressione quantilica e analisi di dati funzionali e ad alta dimensionalità. I miei interessi metodologici si accompagnano ad applicazioni interdisciplinari in ambito ambientale, biomedico e genomico. Ho conseguito il dottorato in Statistica con menzione di Doctor Europaeus e ho partecipato a diversi progetti di ricerca nazionali, tra cui PRIN su modelli grafici, qualità dell'aria, asma ed eventi sismici. Sono inoltre co-inventore di un brevetto italiano nell'ambito dell'autenticazione genetica dei prodotti agroalimentari. Utilizzo abitualmente R per ricerca, didattica e sviluppo metodologico.
