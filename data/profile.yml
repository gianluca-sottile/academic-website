tagline:
  en: I build statistical methods for high-dimensional, censored and functional data — and the open-source tools that make them usable.
  it: Sviluppo metodi statistici per dati ad alta dimensionalità, censurati e funzionali — e gli strumenti open source per usarli.
bio:
  en: >-
    Statistician and Associate Professor at the University of Palermo. My research sits at the junction of
    statistical learning and inference: sparse and penalized models, Gaussian graphical models with censored
    and missing data, quantile regression and functional data analysis, with applications in genomics,
    health and the environment. I hold a PhD (Doctor Europaeus) from Palermo, with a visiting period at
    the Karolinska Institutet, and I maintain several R packages on CRAN.
  it: >-
    Statistico e Professore Associato all'Università di Palermo. La mia ricerca si colloca tra statistical
    learning e inferenza: modelli sparsi e penalizzati, modelli grafici gaussiani con dati censurati e
    mancanti, regressione quantile e analisi di dati funzionali, con applicazioni in genomica, salute e
    ambiente. Ho conseguito il dottorato (Doctor Europaeus) a Palermo, con un periodo di ricerca al
    Karolinska Institutet, e sviluppo diversi pacchetti R pubblicati su CRAN.
