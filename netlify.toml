[build]
  publish = "site"
  command = "pip install -r requirements.txt && python scripts/build.py"

[build.environment]
  PYTHON_VERSION = "3.11"

[context.production.environment]
  BUILD_ENV = "production"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
